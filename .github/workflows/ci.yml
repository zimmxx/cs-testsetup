name: Review checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
